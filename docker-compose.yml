services:
  # Single-node Kafka in KRaft mode (no Zookeeper), official Apache image
  kafka:
    image: apache/kafka:4.2.2
    container_name: evb-kafka
    ports:
      # Only the EXTERNAL listener is published, for clients running on the host
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single broker, so internal topics cannot be replicated
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - evb-network

  # Event Bridge service
  evb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evb-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      KAFKA_HOSTS: kafka:9092
      KAFKA_TOPIC: cdc-events
      KAFKA_CONSUMER_GROUP_ID: evb-consumer-group
      KAFKA_MAX_RETRY: 3
      KAFKA_RETRY_FREQUENCY: 500
      QUEUE_SIZE: 1000
      SINK_CONFIG_PATH: config.yaml
      RULESET_MAP: '{"c":"users,orders","u":"users,orders","d":"users"}'
    # The image ships config.example.yaml as config.yaml. To use your own sinks,
    # create config.yaml next to this file and uncomment:
    # volumes:
    #   - ./config.yaml:/home/evb/config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - evb-network
    restart: unless-stopped

  # Kafka UI for easier debugging (optional)
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: evb-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: evb-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - evb-network

volumes:
  kafka_data:
    driver: local

networks:
  evb-network:
    driver: bridge
