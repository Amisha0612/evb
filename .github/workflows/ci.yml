name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Check out code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Run tests
        run: |
          mkdir -p build
          go test ./... -v -race -coverprofile=build/coverage.txt -covermode=atomic
          go tool cover -func=build/coverage.txt

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./build/coverage.txt
          flags: unittests
          name: codecov-evb

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout 5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: |
          go build -v -o evb .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: evb-binary
          path: evb
