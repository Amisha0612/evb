# Sink configuration. Keys match the structs in internal/relay (yaml tags).
# Copy to config.yaml and point SINK_CONFIG_PATH at it.
config:
  servers:
    # "name" must equal the "server" field of the incoming CDC events.
    - name: "postgres-server"
      sinks:
        # HTTP sinks. method is one of GET, POST, PATCH, DELETE.
        https:
          - url: "https://api.example.com"
            path: "/webhook/cdc-events"
            method: "POST"
            headers:
              Content-Type: "application/json"
            auth:
              clientId: "YOUR_CLIENT_ID"
              clientSecret: "YOUR_CLIENT_SECRET"
              keyProviderURL: "https://auth.example.com/oauth/token"
              scopes: ["events.write"]

        # Kafka sink: every stitched event is published to each topic.
        # Leave hosts/topics empty to disable the Kafka sink for this server.
        kafka:
          hosts:
            - "localhost:9092"
          topics:
            - "processed-cdc-events"
          maxRetry: 3
          retryFrequency: 500 # milliseconds
          # username / password enable SASL/PLAIN when username is set
          username: ""
          password: ""

        # Azure Blob Storage sinks: one JSON blob per stitched event.
        blob:
          - storageName: "yourstorageaccount"
            container: "cdc-events"
            serviceUrl: "https://yourstorageaccount.blob.core.windows.net"
            pathPrefix: "events/"
            sasToken: "?sv=..." # keep real tokens out of version control

    - name: "mysql-server"
      sinks:
        https:
          - url: "https://api.example.com"
            path: "/mysql-events"
            method: "POST"
            auth:
              clientId: "YOUR_CLIENT_ID"
              clientSecret: "YOUR_CLIENT_SECRET"
              keyProviderURL: "https://auth.example.com/oauth/token"
        kafka:
          hosts:
            - "localhost:9092"
          topics:
            - "mysql-cdc-events"
        blob: []
